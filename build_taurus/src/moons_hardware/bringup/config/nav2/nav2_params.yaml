# ============================================================
# AMCL
# ============================================================
amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    set_initial_pose: true
    initial_pose:
      x: -0.20
      y: -0.20
      z: 0.0
      yaw: 0.0
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    scan_topic: scan
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05


# ============================================================
# MAP SERVER
# ============================================================

map_server:
  ros__parameters:

    use_sim_time: false

    yaml_filename: "/home/ros2-taurus/build_taurus/src/moons_hardware/maps/sept-09.yaml"


# ============================================================
# PLANNER SERVER
# ============================================================

planner_server:
  ros__parameters:
    use_sim_time: false

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"

      tolerance: 0.5

      downsample_costmap: false
      downsampling_factor: 1

      allow_unknown: true

      max_iterations: 1000000
      max_on_approach_iterations: 1000

      smooth_path: true

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10


# ============================================================
# CONTROLLER SERVER
# ============================================================

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0
    odom_topic: /odometry/filtered

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3



    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.4

      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5

      rotate_to_heading_angular_vel: 0.5
      rotate_to_heading_min_angle: 0.785

      transform_tolerance: 0.2

      use_velocity_scaled_lookahead_dist: false

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25

      use_rotate_to_heading: true
      allow_reversing: false

      max_angular_accel: 1.0
      max_robot_pose_search_dist: 10.0

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0


# ============================================================
# BT NAVIGATOR
# ============================================================

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml


# ============================================================
# BEHAVIOR SERVER
# ============================================================

behavior_server:
  ros__parameters:
    use_sim_time: false

    cycle_frequency: 10.0

    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2

    behavior_plugins:
      - spin
      - backup
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"

    backup:
      plugin: "nav2_behaviors/BackUp"

    wait:
      plugin: "nav2_behaviors/Wait"


# ============================================================
# GLOBAL COSTMAP
# ============================================================

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 2.0

      resolution: 0.05

      track_unknown_space: true

      footprint: "[[-0.63,-0.52],[-0.63,0.52],[0.51,0.52],[0.71,0.59],[0.71,-0.52]]"

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

          obstacle_max_range: 8.0
          raytrace_max_range: 8.0

          obstacle_min_range: 0.0
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.60
        cost_scaling_factor: 3.0


# ============================================================
# LOCAL COSTMAP
# ============================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      rolling_window: true

      width: 6
      height: 6
      resolution: 0.05

      footprint: "[[-0.63,-0.52],[-0.63,0.52],[0.51,0.52],[0.71,0.59],[0.71,-0.52]]"

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        observation_sources: scan

        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true

          obstacle_max_range: 8.0
          raytrace_max_range: 8.0

          obstacle_min_range: 0.0
          raytrace_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.60
        cost_scaling_factor: 3.0


# ============================================================
# LIFECYCLE MANAGER
# ============================================================

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false

    autostart: true

    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator