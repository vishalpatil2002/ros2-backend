amcl:
  ros__parameters:

    use_sim_time: false

    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
    tf_broadcast: true

    scan_topic: /scan
    laser_model_type: likelihood_field
    laser_max_range: 16.0
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.05

    max_beams: 60

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99

    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1

    sigma_hit: 0.2
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    
    lambda_short: 0.1

    transform_tolerance: 1.0
    save_pose_rate: 0.5 #how frequently amcl  saves the roobot pose

    set_initial_pose: false


    do_beamskip: false
    #these 3 values below are affected only if beam_skip is true
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0



map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/home/ros2-taurus/build_taurus/src/moons_hardware/bringup/maps/oct-03.yaml"